name: Backend CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      run_k6:
        description: 'Run manual k6 Auth smoke test'
        required: false
        default: false
        type: boolean
      base_url:
        description: 'Backend base URL for k6, for example https://staging.example.com'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_k6 }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yomu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build, test, and coverage report
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/yomu_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./gradlew clean build jacocoTestReport --info

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: build/reports/tests/test
          if-no-files-found: warn

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-html-report
          path: build/reports/jacoco/test/html
          if-no-files-found: warn

      - name: Upload JaCoCo XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-xml-report
          path: build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn

      - name: Analyze with SonarQube
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/yomu_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info

  k6-auth-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_k6 && inputs.base_url != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run Auth performance smoke test
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: k6 run performance/auth.k6.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-auth-k6-summary
          path: k6-summary.json
          if-no-files-found: warn
